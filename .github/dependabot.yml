version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "automated"
      - "github-actions"
    commit-message:
      prefix: "Dependabot actions"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
